[settings]
; When disabled, pickpocketing uses Skyrim's vanilla menu
disableMinigame=false
; Phase 1 detection risk multiplier Higher values make pickpocketing harder
difficulty=1
; Higher values place valuable items farther from the exit in phase 2
valueDistanceBias=3
; Multiplies phase 1, phase 2, and control-hint UI size
uiScale=1
; Item preview renderer: Meshes or Icons Icons use live SkyUI/I4 metadata
previewMode=Icons
; Horizontal main UI offset as a percentage of screen width
uiXOffset=0
; Vertical main UI offset as a percentage of screen height
uiYOffset=0
; ImGui keys
placeItemsKey=ImGuiKey_LeftAlt
moveLeftKey=ImGuiKey_A
moveRightKey=ImGuiKey_D
selectKey=ImGuiKey_E

; Debug options
showDebugPickpocketListDuringPhase2=false
showPhase1DebugOverlay=false
allowPickpocketingAllItemsInNPCInventory=false
alwaysRevealAllItems=false
